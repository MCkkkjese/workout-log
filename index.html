<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#F2EDE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>重訓紀錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#F2EDE6;--bg2:#EAE1D5;--card:#F9F6F1;--card2:#EDE4D8;--line:#E4DBD0;
  --text:#3A2F28;--sub:#6E6259;--dim:#6E6259;
  --accent:#9A6B4F;--good:#4F7A57;--warn:#B07A2E;--bad:#B5574B;
  --push:#D97B59;--pull:#5B8FB9;--leg:#4F7A57;
  --sel-bg:rgba(154,107,79,.13);
  --btn1:#A67659;--btn2:#8B5D42;--btn-shadow:rgba(58,47,40,.18);--btn-txt:#FFFFFF;
  --glass-bg:rgba(255,252,247,.55);--glass-bd:rgba(255,255,255,.78);
  --glass-in:rgba(255,255,255,.9);--glass-sh:rgba(58,47,40,.12);
  --plus-ring:rgba(255,252,247,.95);
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --sans:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;
}
html[data-theme="dark"]{
  --bg:#12141A;--bg2:#1B1E27;--card:#1E222D;--card2:#272C3A;--line:#2E3444;
  --text:#F3EFEA;--sub:#B5ACA3;--dim:#9E958C;
  --accent:#C89270;--good:#5FB37A;--warn:#E0A44D;--bad:#E07366;
  --push:#E68967;--pull:#6BB0E0;--leg:#5FB37A;
  --sel-bg:rgba(200,146,112,.18);
  --btn1:#C89270;--btn2:#A47050;--btn-shadow:rgba(0,0,0,.4);--btn-txt:#FFFFFF;
  --glass-bg:rgba(30,34,45,.68);--glass-bd:rgba(255,255,255,.14);
  --glass-in:rgba(255,255,255,.12);--glass-sh:rgba(0,0,0,.45);
  --plus-ring:rgba(30,34,45,.95);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-variant-numeric:tabular-nums;overflow-x:hidden;max-width:100%}
body{padding-bottom:124px;min-height:100vh}
button,a{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-decoration:none}
input,textarea{font:inherit;color:var(--text)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.serif{font-family:var(--serif)}

/* pull to refresh */
.ptr{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--sub);transition:height .18s ease}
.ptr svg{width:15px;height:15px;transition:transform .2s}
.ptr.ready svg{transform:rotate(180deg)}
.ptr.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* header */
.hd{display:flex;justify-content:space-between;align-items:flex-end;padding:max(16px,env(safe-area-inset-top)) 2px 16px}
.hd .date{font-size:13px;color:var(--sub);font-weight:500;letter-spacing:.3px;margin-bottom:4px}
.hd h1{font-family:var(--serif);font-size:30px;font-weight:900;margin:0;letter-spacing:.5px;line-height:1.15}
.misc-btn{min-width:44px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 8px rgba(58,47,40,.04);display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--text);flex:0 0 auto}
.misc-btn.on{background:var(--sel-bg);border-color:var(--accent);color:var(--accent)}
.misc-btn svg{width:17px;height:17px;flex:0 0 auto}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:0 2px 12px rgba(58,47,40,.035)}
.card h2{font-family:var(--serif);font-size:17px;font-weight:700;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}
.card h2 small{font-family:var(--sans);font-size:12px;color:var(--sub);font-weight:500}
.card-link{font-family:var(--sans);min-width:44px;min-height:44px;margin:-10px -8px -10px 0;padding:0 8px;display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:700;color:var(--accent)}
.card-link svg{width:14px;height:14px}
.jrow{width:100%;min-height:54px;display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);text-align:left}
.jrow:last-child{border-bottom:0;padding-bottom:2px}
.jrow .jic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;flex:0 0 auto}
.jrow .jtx{flex:1;min-width:0}
.jrow .jtx b{font-size:14px;display:block}
.jrow .jtx div{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jrow .jgo{color:var(--sub);flex:0 0 auto;display:grid;place-items:center}
.jrow .jgo svg{width:15px;height:15px}
.muted{color:var(--sub)}
.dim{color:var(--sub)}
.row{display:flex;align-items:center;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.grid2 .card{margin:0}
.stat .v{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.5px}
.stat .l{font-size:12px;color:var(--sub);margin-top:4px}

/* banner */
.banner{background:rgba(176,122,46,.11);border:1px solid rgba(176,122,46,.32);border-radius:18px;padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.5;display:flex;justify-content:space-between;align-items:center;gap:10px}
.banner button{flex:0 0 auto;min-height:44px;padding:0 14px;background:var(--warn);color:#fff;font-weight:700;border-radius:12px;font-size:13px}

/* home main hero card */
.hero-main{padding:22px 20px 20px;border-radius:26px}
.hero-top{display:flex;flex-direction:column;align-items:center;text-align:center}
.ring-lg{position:relative;width:210px;height:210px}
.ring-lg svg{transform:rotate(-90deg);display:block}
.ring-lg .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-lg .c .num{display:flex;align-items:baseline;justify-content:center;gap:4px}
.ring-lg .c b{font-family:var(--serif);font-size:72px;font-weight:700;line-height:1;letter-spacing:-2px}
.ring-lg .c .of{font-family:var(--serif);font-size:24px;color:var(--sub);font-weight:600}
.ring-lg .c .rlab{font-size:13px;color:var(--sub);margin-top:6px;font-weight:500}
.card .hero-title{font-family:var(--serif);font-size:26px;font-weight:700;margin:16px 0 6px;line-height:1.25;display:block;text-align:center}
.hero-sub{font-size:14px;color:var(--sub);margin:0 0 16px;line-height:1.5}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{height:40px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;border:1px solid var(--line);color:var(--sub);background:var(--card);display:inline-flex;align-items:center;gap:6px}
.chip.ok{background:var(--good);color:#FFFFFF;border-color:var(--good)}
.chip svg{width:15px;height:15px;flex:0 0 auto}
.hdiv{height:1px;background:var(--line);margin:20px 0 18px}
.att-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.att-hd .ttl{font-size:15px;font-weight:700;color:var(--text)}
.att-hd .pct{font-family:var(--serif);font-size:28px;font-weight:700;line-height:1}
.att-bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.att-track{flex:1;height:14px;border-radius:999px;background:var(--line);overflow:hidden}
.att-fill{height:100%;border-radius:999px;transition:width .4s ease}
.att-emoji{font-size:30px;line-height:1;flex:0 0 auto}
.att-foot{font-size:13px;color:var(--sub)}
.att-foot b{color:var(--text);font-weight:700}

/* home card 2: split */
.split2{display:grid;grid-template-columns:1fr 1fr;padding:18px 6px}
.split2 .col{padding:2px 16px}
.split2 .col:first-child{border-right:1px solid var(--line)}
.split2 .l{font-size:12px;color:var(--sub);margin-bottom:6px;font-weight:500}
.split2 .v{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.3}
.split2 .subv{font-size:12px;color:var(--sub);margin-top:4px;font-weight:500}

/* home card 3: body status */
.body-card{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px}
.body-card .l{font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:500}
.body-card .v{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.3}
.upd-link{min-width:44px;min-height:44px;padding:0 10px;margin-right:-10px;display:inline-flex;align-items:center;gap:3px;font-size:14px;font-weight:700;color:var(--accent);flex:0 0 auto}
.upd-link svg{width:15px;height:15px}

/* weights page */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:14px}
.seg button{flex:1;min-height:44px;padding:8px 2px;border-radius:12px;font-weight:700;font-size:13px;color:var(--sub);white-space:nowrap}
.seg button.on{color:#fff}
.wc{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:12px;box-shadow:0 2px 10px rgba(58,47,40,.03)}
.wc .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wc .t b{font-family:var(--serif);font-size:17px}
.wc .t span{font-size:12px;color:var(--sub)}
.wc .ws{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.wc .w{background:var(--bg2);border-radius:14px;padding:10px 6px;text-align:center}
.wc .w .l{font-size:12px;color:var(--sub)}
.wc .w .v{font-family:var(--serif);font-size:22px;font-weight:700;margin-top:2px}
.wc .w .v small{font-family:var(--sans);font-size:11px;color:var(--sub);font-weight:600}
.wc .w.star{background:var(--card2)}
.wc .ft{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);margin-top:11px;gap:8px;flex-wrap:wrap}
.up{color:var(--good);font-weight:700}.down{color:var(--bad);font-weight:700}

/* goal / week / attendance */
.hero{background:radial-gradient(120% 140% at 100% 0%,var(--bg2) 0%,var(--card) 62%)}
.hero .ring{position:relative;width:118px;height:118px;flex:0 0 auto}
.hero .ring svg{transform:rotate(-90deg)}
.hero .ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.hero .ring .c b{font-family:var(--serif);font-size:34px;line-height:1}
.hero .ring .c span{font-size:12px;color:var(--sub)}
.hero .msg b{font-family:var(--serif);font-size:21px;display:block}
.hero .msg p{margin:6px 0 0;color:var(--sub);font-size:14px;line-height:1.5}
.dayrow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.dayrow:last-child{border-bottom:0}
.dayrow .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;flex:0 0 auto}
.dayrow .tx{flex:1;min-width:0}
.dayrow .tx b{font-size:16px}
.dayrow .tx div{font-size:13px;color:var(--sub);margin-top:2px}
.badge{min-height:44px;min-width:44px;font-size:12px;font-weight:700;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center}
.badge.ok{background:rgba(79,122,87,.14);color:var(--good)}
.badge.no{background:rgba(176,122,46,.14);color:var(--warn)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk div{text-align:center;font-size:11px;color:var(--sub)}
.wk .dot{height:40px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--sub);margin-top:6px}
.wk .dot.today{outline:2px solid var(--accent);outline-offset:1px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:11px;color:var(--sub);text-align:center}
.cal .c{aspect-ratio:1;border-radius:10px;background:var(--bg2);display:grid;place-items:center;font-size:11px;color:var(--sub)}
.cal .c.fut{opacity:.42}
.cal .c.today{outline:2px solid var(--accent);outline-offset:1px}
.cal .c.on{color:#fff;font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:12px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bars .b i{width:100%;border-radius:8px 8px 3px 3px;background:var(--card2);min-height:4px}
.bars .b i.ok{background:var(--good)}
.bars .b i.cur{background:var(--accent)}
.bars .b em{font-style:normal;font-size:12px;font-weight:700;margin-bottom:4px}
.bars .b span{font-size:10px;color:var(--sub);margin-top:6px}
.pace{font-size:13px;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--bg2);line-height:1.5;color:var(--text)}
.mb{display:flex;align-items:flex-end;gap:10px;height:120px}
.mb .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.mb .b i{width:100%;border-radius:8px 8px 3px 3px;min-height:4px;background:var(--card2)}
.mb .b em{font-style:normal;font-size:12px;font-weight:700;margin-bottom:4px}
.mb .b span{font-size:11px;color:var(--sub);margin-top:6px}

/* body + misc */
.fz{display:flex;gap:6px}
.fz button{flex:1;min-height:56px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:8px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--sub)}
.fz button b{font-size:22px}
.fz button.on{border-color:var(--accent);background:var(--sel-bg);color:var(--text)}
.bl{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.bl:last-child{border-bottom:0}
.bl .e{font-size:26px;line-height:1}
.bl .tx{flex:1;font-size:14px}
.bl .tx .m{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.5}
.stchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.stchips span{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--bg2);color:var(--text)}
.tpick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tpick button{min-height:48px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;color:var(--sub)}
.tpick button.on{border-color:var(--accent);background:var(--sel-bg);color:var(--text)}
.tpick svg{width:17px;height:17px;flex:0 0 auto}
.sync-btn{width:100%;min-height:46px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;color:var(--text);margin-bottom:12px}
.sync-btn svg{width:16px;height:16px}
.adv{border:1px solid var(--line);border-radius:16px;background:var(--bg2);overflow:hidden}
.adv summary{min-height:46px;padding:12px 14px;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
.adv summary::-webkit-details-marker{display:none}
.adv[open] summary{border-bottom:1px solid var(--line);color:var(--text)}
.adv .advin{padding:12px 14px 14px;background:var(--card)}

/* edit list */
.sec{font-size:12px;font-weight:700;letter-spacing:1.2px;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sec:first-child{margin-top:0}
.sec i{width:8px;height:8px;border-radius:50%}
.mh{font-size:13px;font-weight:700;color:var(--sub);margin:18px 4px 8px}
.mh:first-child{margin-top:4px}
.er{width:100%;min-height:60px;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin-bottom:8px;text-align:left}
.er .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:700;color:#fff;flex:0 0 auto;font-size:15px}
.er .tx{flex:1;min-width:0}
.er .tx b{font-size:15px}
.er .tx div{font-size:12px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.er .go{color:var(--sub);font-size:18px}

/* bottom floating liquid glass nav */
.bnav{
  position:fixed;left:14px;right:14px;bottom:max(22px,env(safe-area-inset-bottom));
  max-width:532px;margin:0 auto;height:70px;border-radius:35px;z-index:30;
  background:var(--glass-bg);
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--glass-bd);
  box-shadow:inset 0 1px 1px var(--glass-in),0 12px 32px var(--glass-sh);
  display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:center;padding:0 6px;
}
.nbtn{
  min-width:44px;min-height:54px;height:54px;border-radius:27px;padding:0 4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--sub);font-size:11px;font-weight:500;transition:background .15s,color .15s;
}
.nbtn svg{width:20px;height:20px;flex:0 0 auto}
.nbtn.on{background:var(--sel-bg);color:var(--text);font-weight:700}
.nbtn.on svg{color:var(--accent)}
.nplus{
  width:60px;height:60px;border-radius:50%;
  background:var(--accent);color:#FFFFFF;
  border:3px solid var(--plus-ring);
  box-shadow:0 8px 22px rgba(58,47,40,.22);
  display:grid;place-items:center;
  transform:translateY(-16px);
  margin:0 4px;transition:transform .15s;
}
.nplus:active{transform:translateY(-16px) scale(.94)}
.nplus svg{width:26px;height:26px}

/* sheets */
.mask{position:fixed;inset:0;background:rgba(58,47,40,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;border-top:1px solid var(--line);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:10px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.sheet .in{max-width:560px;margin:0 auto}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
.sheet h3{font-family:var(--serif);margin:0 0 14px;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{font-family:var(--sans);min-width:44px;min-height:44px;font-size:14px;color:var(--sub);font-weight:600}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{min-height:96px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 14px;text-align:left}
.pick button b{font-size:17px;display:block;margin-top:8px}
.pick button span{font-size:12px;color:var(--sub)}
.pick button .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#fff}
.pick button .ic svg{width:20px;height:20px}
.fld{min-height:48px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.fld label{font-size:14px;color:var(--sub);flex:0 0 auto}
.fld input{background:none;border:0;text-align:right;font-size:16px;outline:none;color-scheme:light;min-width:0;flex:1}
html[data-theme="dark"] .fld input{color-scheme:dark}

.sore button.on{background:var(--sel-bg);border-color:var(--accent);color:var(--text);font-weight:600}

.save{width:100%;min-height:50px;padding:14px;border-radius:16px;background:linear-gradient(145deg,var(--btn1),var(--btn2));font-size:16px;font-weight:700;color:var(--btn-txt);margin-top:6px}

.del{width:100%;min-height:48px;padding:12px;border-radius:16px;background:rgba(181,87,75,.1);color:var(--bad);font-weight:700;margin-top:10px;border:1px solid rgba(181,87,75,.28)}
.del.sure{background:var(--bad);color:#fff}
.bodysec{border-top:1px dashed var(--line);margin-top:18px;padding-top:6px}

.lab{font-size:13px;color:var(--sub);margin:14px 2px 8px}
.editing{font-size:12px;color:var(--warn);margin:-6px 0 12px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--card);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transition:all .25s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.empty{color:var(--sub);font-size:14px;text-align:center;padding:16px 0}

.fade{animation:fd .22s ease}
@keyframes fd{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

<script>
var APP_VERSION = 'v2.1.2';
var APP_UPDATED = '2026-11-17 11:10';
var DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbzI24qk2i3BUXBsDqUchV4JmmpU-NgGskHZTKzd26LEIkjIqXaYTD3EysZtcoC7bZFu/exec';
var FALLBACK_DATA = {
  now: '尚未連線（顯示預設菜單）',
  today: (function(){var d=new Date(),m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;})(),
  target: 3,
  days: ['推日','拉日','腿日'],
  menu: [
    {ex:'臥推',day:'推日',part:'胸',w:22.5,k:22.5},

    {ex:'上背划船（寬）',day:'拉日',part:'背',w:35,k:35},
    {ex:'單側划船',day:'拉日',part:'背',w:16.25,k:16.25},
    {ex:'垂直下拉',day:'拉日',part:'背',w:31.25,k:36.25},
    {ex:'二頭彎舉',day:'拉日',part:'二頭',w:7.5,k:10},

    {ex:'啞鈴保加利亞分腿蹲',day:'腿日',part:'腿',w:0,k:10}
  ],
  log: [],
  raw: [],

};

function setCookie(name,val,days){
  var d=new Date();d.setTime(d.getTime()+(days||365)*86400000);
  document.cookie=name+'='+encodeURIComponent(val||'')+'; expires='+d.toUTCString()+'; path=/; SameSite=Lax';
}
function getCookie(name){
  var m=document.cookie.match(new RegExp('(?:^|; )'+name.replace(/([.$?*|{}()[\]\\/+^])/g,'\\$1')+'=([^;]*)'));
  return m?decodeURIComponent(m[1]):null;
}
function getTheme(){
  return getCookie('gym_theme') || localStorage.getItem('gym_theme') || 'light';
}
function applyTheme(t){
  var dark=(t==='dark');
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',dark?'#12141A':'#F2EDE6');
  setCookie('gym_theme',dark?'dark':'light',365);
}
applyTheme(getTheme());

function getCfg(){
  var q=new URLSearchParams(location.search);
  if(q.get('api'))setCookie('gym_api_url',q.get('api'),365);
  if(q.get('token')!==null)setCookie('gym_api_token',q.get('token'),365);
  return {
    url: getCookie('gym_api_url') || localStorage.getItem('gym_api_url') || DEFAULT_API_URL,
    token: (getCookie('gym_api_token') !== null ? getCookie('gym_api_token') : localStorage.getItem('gym_api_token')) || ''
  };
}
function loadCache(){
  try{
    var raw=localStorage.getItem('gym_cache');
    if(raw){var d=JSON.parse(raw);if(d&&d.days&&d.menu)return d;}
  }catch(e){}
  return FALLBACK_DATA;
}
function saveCache(d){
  try{localStorage.setItem('gym_cache',JSON.stringify(d));}catch(e){}
}

var D = loadCache();
var connErr = '';
var COLOR = {'推日':'var(--push)','拉日':'var(--pull)','腿日':'var(--leg)'};
var SHORT = {'推日':'推','拉日':'拉','腿日':'腿'};
var FACE = ['','😄','🙂','😐','😩','🥵'];
var FTXT = ['','精神很好','還不錯','普通','有點疲勞','很疲勞'];
var STATUS = ['狀態超好','精神好','有點累','很疲勞','肌肉痠痛','睡不好','關節不舒服','小傷','壓力大','生病'];
var SORE = ['胸','背','肩','手臂','腿','臀','核心','下背'];
var WDAYS = ['週日','週一','週二','週三','週四','週五','週六'];
var state = {tab:'home', wday:null, eseg:'w'};

/* ---------- SVG icons (line style) ---------- */
var ICO = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4.5v-6h3v6H18a1 1 0 0 0 1-1V9.5"/></svg>',
  weights:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11"/><path d="M17.5 6.5v11"/><path d="M3.5 9v6"/><path d="M20.5 9v6"/><path d="M6.5 12h11"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>',
  diary:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2.5"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/><path d="M8 14h2"/><path d="M14 14h2"/><path d="M8 18h2"/></svg>',
  other:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32 1.41-1.41"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
  refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>',
  pulse:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>'
};

function $(id){return document.getElementById(id);}
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function fd(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;}
function md(s){var d=pd(s);return (d.getMonth()+1)+'/'+d.getDate();}
function headerDate(s){var d=pd(s);return (d.getMonth()+1)+' 月 '+d.getDate()+' 日 · '+WDAYS[d.getDay()];}
function monday(d){var x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function add(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function diff(a,b){return Math.round((pd(b)-pd(a))/86400000);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function kg(v){return String(Math.round(v*100)/100);}
function ago(s){var n=diff(s,D.today);return n===0?'今天':n===1?'昨天':n<0?md(s):n+' 天前';}
function col(day){return COLOR[day]||'var(--accent)';}
function splitList(s){return String(s||'').split(/[、,]/).map(function(x){return x.trim();}).filter(String);}

/* ---------- API ---------- */
function apiFetch(action, payload){
  var cfg=getCfg();
  if(!cfg.url) return Promise.reject(new Error('尚未設定 Apps Script API 網址'));
  if(action==='getData'){
    var u=cfg.url+(cfg.url.indexOf('?')>=0?'&':'?')+'api=1&token='+encodeURIComponent(cfg.token)+'&_t='+Date.now();
    return fetch(u,{method:'GET',redirect:'follow'}).then(parseApiRes);
  }
  return fetch(cfg.url,{
    method:'POST',
    redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:action,token:cfg.token,payload:payload||{}})
  }).then(parseApiRes);
}
function parseApiRes(res){
  return res.text().then(function(txt){
    var j;
    try{j=JSON.parse(txt);}
    catch(e){throw new Error('Apps Script 尚未更新為 API 模式或權限未設為「任何人」');}
    if(!j.ok)throw new Error(j.error||'伺服器錯誤');
    return j.data;
  });
}
function refreshData(silent){
  var ptr=$('ptr'),ptxt=$('ptrTxt');
  if(!silent){ptr.style.height='40px';ptr.classList.add('spin');ptxt.textContent='同步最新資料中…';}
  return apiFetch('getData').then(function(nd){
    D=nd; connErr=''; saveCache(nd); derive(); render();
    ptr.classList.remove('spin','ready');ptr.style.height='0';
    if(!silent)toast('已同步最新資料');
  }).catch(function(err){
    connErr=err.message;
    ptr.classList.remove('spin','ready');ptr.style.height='0';
    render();
    if(!silent)toast('連線失敗：'+err.message);
  });
}

/* ---------- derived ---------- */
var M;
function derive(){
  var today=pd(D.today), mon=monday(today);
  var ses={};
  D.log.forEach(function(r){var k=r.d+'|'+r.day;(ses[k]=ses[k]||{d:r.d,day:r.day,rows:[]}).rows.push(r);});
  var sessions=Object.keys(ses).map(function(k){return ses[k];}).sort(function(a,b){return a.d<b.d?1:-1;});
  var dates={};sessions.forEach(function(s){(dates[s.d]=dates[s.d]||[]).push(s.day);});
  function wc(st){var n=0;for(var i=0;i<7;i++)if(dates[fd(add(st,i))])n++;return n;}
  var weeks=[];for(var i=7;i>=0;i--){var s=add(mon,-7*i);weeks.push({s:s,n:wc(s),cur:i===0});}
  var thisN=weeks[7].n;
  var streak=0;for(var w=(thisN>=D.target?0:1);w<260;w++){if(wc(add(mon,-7*w))>=D.target)streak++;else break;}
  var bestStreak=streak;
  if(sessions.length){
    var firstMon=monday(pd(sessions[sessions.length-1].d)),run=0;
    for(var cm0=firstMon;cm0<=mon;cm0=add(cm0,7)){
      if(wc(cm0)>=D.target){run++;if(run>bestStreak)bestStreak=run;}
      else run=0;
    }
  }
  var done={};sessions.forEach(function(s){if(pd(s.d)>=mon&&pd(s.d)<=today)(done[s.day]=done[s.day]||[]).push(s.d);});
  var lastByDay={};sessions.forEach(function(s){if(!lastByDay[s.day])lastByDay[s.day]=s.d;});
  var ex={};
  D.menu.forEach(function(m){
    var rows=D.log.filter(function(r){return r.ex===m.ex;});
    var byD={};rows.forEach(function(r){(byD[r.d]=byD[r.d]||{})[r.set]=r;});
    var ds=Object.keys(byD).sort().reverse();
    var pr=0,prd='';rows.forEach(function(r){if(r.set!=='熱身'&&r.kg>pr){pr=r.kg;prd=r.d;}});
    var lastOf=function(set){for(var i=0;i<ds.length;i++){if(byD[ds[i]][set])return byD[ds[i]][set];}return null;};
    ex[m.ex]={m:m,ds:ds,cur:ds[0]?byD[ds[0]]:null,prev:ds[1]?byD[ds[1]]:null,pr:pr,prd:prd,lw:lastOf('熱身'),lk:lastOf('正式'),lb:lastOf('突破')};
  });
  function month(y,mo){
    var dim=new Date(y,mo+1,0).getDate(),n=0;
    for(var i=1;i<=dim;i++){if(dates[fd(new Date(y,mo,i))])n++;}
    return {y:y,m:mo,dim:dim,n:n,goal:Math.round(dim/7*D.target)};
  }
  var months=[];for(var k=5;k>=0;k--){var dd=new Date(today.getFullYear(),today.getMonth()-k,1);months.push(month(dd.getFullYear(),dd.getMonth()));}
  var bodyS=D.body.slice().sort(function(a,b){return a.d===b.d?0:(a.d<b.d?1:-1);});
  var raw=D.raw.slice().sort(function(a,b){return a.d===b.d?0:(a.d<b.d?1:-1);});
  M={today:today,mon:mon,sessions:sessions,dates:dates,weeks:weeks,thisN:thisN,streak:streak,bestStreak:bestStreak,done:done,lastByDay:lastByDay,ex:ex,months:months,cm:months[5],body:bodyS,raw:raw};
}
function defaults(exn){
  var e=M.ex[exn],m=e.m,leg=m.day==='腿日';
  var k=e.lk?e.lk.kg:m.k, w=e.lw?e.lw.kg:(m.w||m.k), b=e.lb?e.lb.kg:k;
  var r=(e.lk&&e.lk.reps)||(leg?10:8);
  return {w:w||'',k:k||'',b:b||'',r:r};
}
function nextDay(){
  var miss=D.days.filter(function(d){return !M.done[d];});
  if(!miss.length)return null;
  miss.sort(function(a,b){return (M.lastByDay[a]||'0')<(M.lastByDay[b]||'0')?-1:1;});
  return miss[0];
}
function attLevel(pc){
  if(pc>=70)return {emoji:'😄',color:'var(--good)'};
  if(pc>=40)return {emoji:'😐',color:'var(--warn)'};
  return {emoji:'😭',color:'var(--bad)'};
}
function bodyStatusText(b){
  var st=splitList(b.st);
  if(st.length)return st.slice(0,2).join('、');
  if(b.f&&FTXT[b.f])return FTXT[b.f];
  if(b.note)return b.note;
  var so=splitList(b.sore);
  if(so.length)return so.join('、')+'痠痛';
  return '已記錄';
}

/* ---------- shared pieces ---------- */
function ringLarge(n,t){
  var r=88,c=2*Math.PI*r,p=Math.min(n/t,1);
  return '<div class="ring-lg"><svg width="210" height="210"><circle cx="105" cy="105" r="'+r+'" stroke="var(--line)" stroke-width="16" fill="none"/>'+
    '<circle cx="105" cy="105" r="'+r+'" stroke="'+(n>=t?'var(--good)':'var(--accent)')+'" stroke-width="16" fill="none" stroke-linecap="round" stroke-dasharray="'+(c*p)+' '+c+'"/></svg>'+
    '<div class="c"><div class="num"><b>'+n+'</b><span class="of">/ '+t+'</span></div><div class="rlab">本週訓練</div></div></div>';
}
function ringSmall(n,t,label){
  var r=50,c=2*Math.PI*r,p=Math.min(n/t,1);
  return '<div class="ring"><svg width="118" height="118"><circle cx="59" cy="59" r="'+r+'" stroke="var(--line)" stroke-width="11" fill="none"/>'+
    '<circle cx="59" cy="59" r="'+r+'" stroke="'+(n>=t?'var(--good)':'var(--accent)')+'" stroke-width="11" fill="none" stroke-linecap="round" stroke-dasharray="'+(c*p)+' '+c+'"/></svg>'+
    '<div class="c"><div><b>'+n+'</b><span> / '+t+'</span><br><span>'+(label||'本週')+'</span></div></div></div>';
}
function dayChips(){
  return '<div class="chips">'+D.days.map(function(d){
    var ok=!!M.done[d];
    return '<span class="chip'+(ok?' ok':'')+'">'+(ok?ICO.check:'')+esc(d)+'</span>';
  }).join('')+'</div>';
}
function heroMsg(){
  var n=M.thisN,t=D.target,left=6-((M.today.getDay()+6)%7);
  if(n>=t)return ['本週達標','已經練滿 '+t+' 次，多練都是賺到。'];
  if(n===0)return ['本週還沒開始','還有 '+(left+1)+' 天，今天就是開始的好時機。'];
  return ['還差 '+(t-n)+' 次','本週還剩 '+left+' 天'+(left<t-n?'，有點趕了！':'，穩穩來。')];
}

function monthCalCard(cm,rightBtn){
  var first=new Date(cm.y,cm.m,1),off=(first.getDay()+6)%7;
  var h='<div class="card"><h2><span>'+cm.y+' 年 '+(cm.m+1)+' 月出勤日曆</span>'+(rightBtn||'')+'</h2><div class="cal">'+['一','二','三','四','五','六','日'].map(function(x){return '<div class="h">'+x+'</div>';}).join('');

function fatigueChart(){
  var pts=M.body.filter(function(p){return p.f>0;}).slice(0,14).reverse();
  if(pts.length<2)return '';
  var W=320,H=120,px=16,py=14;
  var x=function(i){return px+(W-2*px)*i/(pts.length-1);},y=function(f){return py+(H-2*py)*(f-1)/4;};
  var path=pts.map(function(p,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(p.f).toFixed(1);}).join(' ');
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">';
  [1,3,5].forEach(function(f){s+='<line x1="'+px+'" x2="'+(W-px)+'" y1="'+y(f)+'" y2="'+y(f)+'" stroke="var(--line)" stroke-dasharray="3 4"/>';});
  s+='<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>';
  pts.forEach(function(p,i){var c=p.f>=4?'var(--bad)':p.f<=2?'var(--good)':'var(--warn)';s+='<circle cx="'+x(i)+'" cy="'+y(p.f)+'" r="4.5" fill="'+c+'" stroke="var(--card)" stroke-width="2"/>';});
  s+='</svg><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:4px"><span>'+md(pts[0].d)+'</span><span>上 = 精神好　下 = 很累</span><span>'+md(pts[pts.length-1].d)+'</span></div>';
  return '<div class="card"><h2>疲勞趨勢 <small>最近 '+pts.length+' 筆</small></h2>'+s+'</div>';
}

    if(rec){var it=rec.items[m.ex]||{};var on=it.w!==''&&it.w!==undefined||it.k!==''&&it.k!==undefined||it.b!==''&&it.b!==undefined;
      return {ex:m.ex,on:on,w:it.w===undefined?'':it.w,k:it.k===undefined?'':it.k,b:it.b===undefined?'':it.b,r:it.r===undefined?'':it.r};}
    var d=defaults(m.ex);return {ex:m.ex,on:true,w:d.w,k:d.k,b:d.b,r:d.r};})};
  var h='<h3><span style="color:'+col(day)+'">'+(rec?'修改 ':'')+esc(day)+'</span><button data-close>取消</button></h3>';
  if(rec)h+='<div class="editing">正在修改 '+md(rec.d)+' 的紀錄</div>';
  h+='<div class="fld"><label>日期</label><input type="date" id="fdate" value="'+(rec?rec.d:D.today)+'"></div>';
  form.items.forEach(function(it,i){
    h+='<div class="exf'+(it.on?'':' off')+'" id="exf'+i+'"><div class="t"><b>'+esc(it.ex)+'</b><button class="tg" data-skip="'+i+'">'+(it.on?'今天沒做':'恢復')+'</button></div>';
    [['w','熱身',2.5,'kg'],['k','⭐ 正式',2.5,'kg'],['b','⭐ 突破',2.5,'kg'],['r','每組次數',1,'下']].forEach(function(f){
      h+='<div class="st"><span class="l">'+f[1]+'</span><div class="ctl"><button data-step="'+i+','+f[0]+',-'+f[2]+'">−</button><input inputmode="decimal" id="in'+i+f[0]+'" value="'+(it[f[0]]===''?'':kg(it[f[0]]))+'"><button data-step="'+i+','+f[0]+','+f[2]+'">+</button></div><span class="u">'+f[3]+'</span></div>';
    });
    h+='</div>';
  });
  if(!rec){
    h+='<div class="lab">預設值是你上次這個動作的重量；熱身 1 組、正式 3 組、突破 1 組。</div>';
    h+='<div class="bodysec"><div class="lab" style="font-size:16px;color:var(--text);font-weight:700">練完的身體狀況<span class="opt">選填，沒填就不記</span></div>'+bodyFields()+'</div>';
  }
  h+='<button class="save" id="saveBtn" data-save>'+(rec?'儲存修改':'儲存 '+esc(day))+'</button>';
  if(rec)h+='<button class="del" data-del>刪除這筆紀錄</button>';
  openSheet(h);
}
function openBody(rec){
  form={type:'b',id:rec?rec.id:null};
  var h='<h3>'+(rec?'修改身體狀況':'身體狀況')+'<button data-close>取消</button></h3>';
  if(rec)h+='<div class="editing">正在修改 '+md(rec.d)+' 的紀錄</div>';
  h+='<div class="fld"><label>日期</label><input type="date" id="fdate" value="'+(rec?rec.d:D.today)+'"></div>';
  h+=bodyFields(rec);
  h+='<button class="save" id="saveBtn" data-save>'+(rec?'儲存修改':'儲存身體狀況')+'</button>';
  if(rec)h+='<button class="del" data-del>刪除這筆紀錄</button>';
  openSheet(h);
}
function openExercise(exObj){
  var isNew=!exObj;
  form={type:'ex',oldEx:isNew?null:exObj.ex,day:isNew?(D.days[0]||'推日'):exObj.day};
  var h='<h3>'+(isNew?'新增動作':'修改動作')+'<button data-close>取消</button></h3>';
  if(isNew){
    h+='<div class="lab">訓練日</div><div class="sore">'+D.days.map(function(d){return '<button data-exday="'+esc(d)+'" class="'+(d===form.day?'on':'')+'">'+esc(d)+'</button>';}).join('')+'</div>';
  } else {
    h+='<div class="editing">所屬訓練日：'+esc(exObj.day)+'</div>';
  }
  h+='<div class="fld"><label>動作名稱</label><input id="exName" value="'+esc(isNew?'':exObj.ex)+'" placeholder="例如：飛鳥夾胸"></div>';
  h+='<div class="fld"><label>部位（選填）</label><input id="exPart" value="'+esc(isNew?'':exObj.part)+'" placeholder="例如：胸、背、肩"></div>';
  h+='<div class="fld"><label>預設熱身 (kg)</label><input inputmode="decimal" id="exW" value="'+esc(isNew?'':exObj.w)+'" placeholder="0"></div>';
  h+='<div class="fld"><label>預設正式 (kg)</label><input inputmode="decimal" id="exK" value="'+esc(isNew?'':exObj.k)+'" placeholder="0"></div>';
  h+='<div class="lab">'+(isNew?'新增後會在試算表「動作」與「'+esc(form.day)+'紀錄」自動加上對應欄位。':'修改名稱會同步更新菜單與紀錄表標題。')+'</div>';
  h+='<button class="save" id="saveBtn" data-save>'+(isNew?'新增動作':'儲存修改')+'</button>';
  openSheet(h);
}
function readNum(id){var el=$(id);if(!el)return '';var v=el.value.trim();if(v==='')return '';var n=Number(v);return isNaN(n)?'':n;}
function call(fn,payload,btn,label,after){
  btn.disabled=true;btn.textContent='處理中…';
  apiFetch(fn,payload).then(function(nd){
    D=nd;connErr='';saveCache(nd);derive();closeSheet();if(after)after();render();toast(label);
  }).catch(function(e){
    btn.disabled=false;btn.textContent='再試一次';toast('失敗：'+e.message);
  });
}
function doSave(){
  var btn=$('saveBtn'),date=$('fdate')?($('fdate').value||D.today):D.today;
  if(form.type==='ex'){
    var ex=$('exName').value.trim();
    if(!ex){toast('請輸入動作名稱');return;}
    var ep={day:form.day,ex:ex,part:$('exPart').value.trim(),w:readNum('exW'),k:readNum('exK')};
    if(form.oldEx){ep.oldEx=form.oldEx;call('updateExercise',ep,btn,'已更新動作 ✓');}
    else call('addExercise',ep,btn,'已新增動作 ✓');
    return;
  }
  if(form.type==='w'){
    var items=[];form.items.forEach(function(it,i){if(it.on)items.push({ex:it.ex,w:readNum('in'+i+'w'),k:readNum('in'+i+'k'),b:readNum('in'+i+'b'),r:readNum('in'+i+'r')});});
    if(!items.length){toast('至少要有一個動作');return;}
    var p={day:form.day,date:date,items:items};
    if(form.id){p.id=form.id;call('updateWorkout',p,btn,'已修改 ✓');return;}
    var b=readBody();if(!b.empty)p.body=b;
    call('saveWorkout',p,btn,'已儲存 ✓');
  } else {
    var bb=readBody();if(bb.empty){toast('至少填一項');return;}
    bb.date=date;
    if(form.id){bb.id=form.id;call('updateBody',bb,btn,'已修改 ✓');return;}
    call('saveBody',bb,btn,'已儲存 ✓');
  }
}
function doDel(t){
  if(!t.classList.contains('sure')){t.classList.add('sure');t.textContent='再按一次確定刪除（無法復原）';return;}
  if(form.type==='w')call('deleteWorkout',{day:form.day,id:form.id},t,'已刪除');
  else call('deleteBody',{id:form.id},t,'已刪除');
}
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove('on');},2500);}
function findRaw(id){for(var i=0;i<D.raw.length;i++)if(D.raw[i].id===id)return D.raw[i];return null;}
function findBody(id){for(var i=0;i<D.body.length;i++)if(D.body[i].id===id)return D.body[i];return null;}
function findMenu(key){var p=key.split('|'),day=p[0],ex=p.slice(1).join('|');for(var i=0;i<D.menu.length;i++)if(D.menu[i].day===day&&D.menu[i].ex===ex)return D.menu[i];return null;}

document.addEventListener('click',function(ev){
  var t=ev.target.closest('button');if(!t)return;
  var ds=t.dataset;
  if(ds.tab){state.tab=ds.tab;render();window.scrollTo(0,0);return;}
  if(ds.gomisc!==undefined){state.tab='edit';state.eseg='misc';render();window.scrollTo(0,0);return;}
  if(ds.goworkouts!==undefined){state.tab='edit';state.eseg='w';render();window.scrollTo(0,0);return;}
  if(ds.openpick!==undefined){openPicker();return;}
  if(ds.wday){state.wday=ds.wday;render();return;}
  if(ds.eseg){state.eseg=ds.eseg;render();return;}
  if(ds.log!==undefined){openWorkout(ds.log);return;}
  if(ds.newbody!==undefined){openBody();return;}
  if(ds.editw){var r=findRaw(ds.editw);if(r)openWorkout(r.day,r);return;}
  if(ds.editb){var b=findBody(ds.editb);if(b)openBody(b);return;}
  if(ds.addex!==undefined){openExercise();return;}
  if(ds.editex){var m=findMenu(ds.editex);if(m)openExercise(m);return;}
  if(ds.exday){form.day=ds.exday;[].forEach.call(document.querySelectorAll('[data-exday]'),function(x){x.classList.toggle('on',x.dataset.exday===ds.exday);});return;}
  if(ds.close!==undefined){closeSheet();return;}
  if(ds.syncnow!==undefined){refreshData(false);return;}
  if(ds.theme){
    applyTheme(ds.theme);
    [].forEach.call(document.querySelectorAll('[data-theme]'),function(x){x.classList.toggle('on',x.dataset.theme===ds.theme);});
    toast(ds.theme==='dark'?'已切換深色模式':'已切換奶茶色模式');
    return;
  }
  if(ds.savecfg!==undefined){
    setCookie('gym_api_url',$('cfgUrl').value.trim(),365);
    setCookie('gym_api_token',$('cfgTok').value.trim(),365);
    refreshData(false);return;
  }
  if(ds.save!==undefined){doSave();return;}
  if(ds.del!==undefined){doDel(t);return;}
  if(ds.skip!==undefined){var i=+ds.skip,it=form.items[i];it.on=!it.on;$('exf'+i).classList.toggle('off',!it.on);t.textContent=it.on?'今天沒做':'恢復';return;}
  if(ds.step){var p=ds.step.split(','),inp=$('in'+p[0]+p[1]),v=Number(inp.value)||0;v=Math.max(0,Math.round((v+Number(p[2]))*100)/100);inp.value=kg(v);return;}
  if(ds.fz){var f=+ds.fz;form.body.f=form.body.f===f?0:f;[].forEach.call(document.querySelectorAll('[data-fz]'),function(x){x.classList.toggle('on',+x.dataset.fz===form.body.f);});return;}
  if(ds.st){form.body.st[ds.st]=!form.body.st[ds.st];t.classList.toggle('on',form.body.st[ds.st]);return;}
  if(ds.sore){form.body.sore[ds.sore]=!form.body.sore[ds.sore];t.classList.toggle('on',form.body.sore[ds.sore]);return;}
});
$('mask').onclick=closeSheet;

/* ---------- pull-to-refresh ---------- */
(function(){
  var startY=0,pulling=false,ready=false;
  document.addEventListener('touchstart',function(e){
    if(window.scrollY<=0&&!$('sheet').classList.contains('on')&&e.touches.length===1){
      startY=e.touches[0].clientY;pulling=true;ready=false;
    } else pulling=false;
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!pulling)return;
    var dy=e.touches[0].clientY-startY;
    if(dy>10&&window.scrollY<=0){
      var h=Math.min(54,Math.round(dy*0.45));
      $('ptr').style.height=h+'px';
      ready=dy>75;
      $('ptr').classList.toggle('ready',ready);
      $('ptrTxt').textContent=ready?'放開立即更新':'下拉重新整理';
    }
  },{passive:true});
  document.addEventListener('touchend',function(){
    if(!pulling)return;
    pulling=false;
    if(ready)refreshData(false);
    else{$('ptr').style.height='0';$('ptr').classList.remove('ready');}
  },{passive:true});
})();

function checkAppUpdate(){
  if(location.protocol==='file:')return;
  fetch('version.json?_t='+Date.now(),{cache:'no-store'}).then(function(r){
    return r.ok?r.json():null;
  }).then(function(info){
    if(!info||!info.v||info.v===APP_VERSION)return;
    try{
      if(sessionStorage.getItem('gym_reloaded_v')===info.v)return;
      sessionStorage.setItem('gym_reloaded_v',info.v);
    }catch(e){}
    var u=new URL(location.href);
    u.searchParams.set('_v',info.v);
    location.replace(u.toString());
  }).catch(function(){});
}

derive();render();
refreshData(true);
checkAppUpdate();
</script>
</body>
